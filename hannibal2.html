.filters{background:var(--achtergrond);padding:18px 20px;display:grid;gap:14px}
.rij{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-start}
.veld{display:grid;gap:5px;min-width:0}
.veld label,.veld .lbl{font-family:var(--kop);font-weight:700;font-size:.95rem;color:var(--tekst);text-transform:uppercase;letter-spacing:.3px}
.veld select,.veld input{padding:9px 12px;border:2px solid var(--lijn);border-radius:0;font:inherit;font-size:.88rem;background:#fff;color:var(--tekst);min-width:210px}
.veld.zoek{flex:1;min-width:200px}.veld.zoek input{width:100%}
.veld input:focus,.veld select:focus,.chip:focus-visible,.kaart:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.groep{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--lijn);background:#fff;border-radius:0;padding:5px 12px;font:inherit;font-size:.82rem;cursor:pointer;color:var(--tekst)}
.chip:hover{border-color:var(--groen)}
.chip[aria-pressed=true]{background:var(--groen);border-color:var(--groen);color:#fff;font-weight:700}
.tegels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%}
.chip.tegel{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;font-size:.84rem;line-height:1.2;text-align:center;font-family:var(--kop);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.chip.tegel .ti{font-size:1.5rem;line-height:1}
.sg{display:flex;border:2px solid var(--lijn);background:#fff}
.sg .chip.seg{flex:1 1 auto;text-align:center}
.chip.seg:focus-visible{outline:3px solid var(--teal);outline-offset:-5px}
.chip.seg{border:none;border-right:2px solid var(--lijn);padding:6px 12px}
.sg .chip.seg:last-child{border-right:none}
.chip.seg:hover{background:var(--groen-licht)}
.chip.seg[aria-pressed=true]{background:var(--groen);color:#fff}
.rij.seg-rij{gap:12px 22px;align-items:flex-end}
.nota{margin:0;font-size:.85rem;background:#fff;border-left:5px solid var(--groen);padding:8px 14px}
details summary{cursor:pointer;font-family:var(--kop);font-size:1rem;color:var(--teal);font-weight:700;text-transform:uppercase}
.reset{background:none;border:none;color:var(--teal);text-decoration:underline;cursor:pointer;font:inherit;font-size:.85rem;justify-self:start}
.matnota{margin:8px 0 0;font-size:.8rem;background:#fff;border-left:5px solid var(--geel);padding:7px 12px;color:var(--tekst)}
.balk{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px;flex-wrap:wrap;gap:8px}
.balk h2{font-size:1.5rem}
.kijker{margin:22px 0 4px;background:rgba(230,183,3,.12);border-top:6px solid var(--geel);padding:16px 18px}
.kijker h2{font-size:1.5rem}.kuitleg{margin:2px 0 12px;font-size:.85rem}
.kraster{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.kk{background:#fff;border:none;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;gap:6px;align-content:start}
.kk:hover{box-shadow:0 0 0 3px var(--geel)}
.kk h3{font-size:1.25rem;color:var(--donker)}
.kk q{font-size:.88rem;font-style:italic;quotes:"“" "”"}
.kk .wie{font-size:.78rem;color:#8a6d12;font-weight:700}
.ster{display:inline-block;font-family:var(--kop);font-size:.8rem;font-weight:700;text-transform:uppercase;background:var(--geel);color:#fff;padding:1px 8px}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.kaart{background:#fff;border:1px solid #ddd;border-top:6px solid var(--groen);padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:9px;transition:.15s}
.kaart.t-knutselen{border-top-color:var(--geel)}
.kaart.t-binnen{border-top-color:var(--teal)}
.kaart.t-buiten{border-top-color:var(--groen)}
.kaart.t-wacht{border-top-color:var(--paars)}
.kaart.t-kennismaking{border-top-color:var(--koraal)}
.kaart:hover{box-shadow:0 6px 18px rgba(0,0,0,.12);transform:translateY(-2px)}
.kaart h3{font-size:1.35rem;color:var(--donker);line-height:1.15}
.kaart p{margin:0;font-size:.87rem;}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px}
.tag{font-family:var(--kop);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--teal)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;margin-top:auto;padding-top:9px;border-top:1px solid #eee}
.mat-ok{color:var(--groen-donker);font-weight:700}
.mat-koop{color:var(--koraal);font-weight:700}
.mat-onb{color:#999;font-weight:700}
.leeg{padding:40px;text-align:center;background:var(--achtergrond)}
.dfoto{cursor:zoom-in}
#zoom{max-width:96vw;width:auto;background:transparent;box-shadow:none;overflow:visible}
#zoom img{display:block;max-width:96vw;max-height:92vh;margin:0 auto;cursor:zoom-out;background:#fff}
#zoom::backdrop{background:rgba(0,0,0,.85)}
.foto{width:100%;height:150px;object-fit:cover;background:#eee}.dfoto{display:block;width:100%;max-height:300px;object-fit:cover}
.meerw{text-align:center;margin:26px 0 0}
.meer{display:inline-flex;align-items:stretch;font-family:var(--kop);font-size:1.15rem;font-weight:700;text-transform:uppercase;background:var(--groen);color:#fff;border:none;border-radius:0;padding:0;cursor:pointer}
.meer span{padding:12px 24px}
.meer::after{content:"➜";background:var(--donker);padding:12px 16px;display:grid;place-items:center}
.meer:hover{background:var(--groen-donker)}
.meerw small{display:block;margin-top:9px;color:#888;font-size:.78rem}
dialog{border:none;border-radius:0;padding:0;max-width:860px;width:calc(100% - 28px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dkop{background:var(--teal);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dkop h2{color:#fff;font-size:2rem;line-height:1.1;margin-top:6px}
.dkop .tag{color:#fff}
.dkop button{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:0;width:38px;height:38px;font-size:1.3rem;cursor:pointer;flex:none}
.dbody{padding:20px 22px 24px;display:grid;gap:16px}
.dbody h3{font-size:1.15rem;margin-bottom:4px}
.dbody ul{margin:0;padding-left:20px}
.dbody li{margin:3px 0}
.wat{background:var(--groen-licht);border-left:6px solid var(--groen);padding:14px 18px}
.wat h3{font-size:1.4rem;margin-bottom:6px}
.wat p{margin:0;font-size:1rem;line-height:1.65;color:var(--donker)}
.wat h4{font-size:1.05rem;margin:14px 0 4px;color:var(--groen-donker)}
.wat ol{margin:0;padding-left:22px;font-size:.95rem;line-height:1.6;color:var(--donker)}
.wat li{margin:2px 0}
.dtwee{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.links{display:grid;gap:12px}
.stap{border:1px solid #dfe3e6;padding:14px 18px}
.stap h3{font-size:1.15rem;margin-bottom:8px;color:var(--teal)}
.stap ol{list-style:none;counter-reset:s;margin:0;padding:0}
.stap li{counter-increment:s;position:relative;padding:4px 0 4px 34px;margin:0;line-height:1.55;font-size:.95rem}
.stap li::before{content:counter(s);position:absolute;left:0;top:4px;width:24px;height:24px;background:var(--teal);color:#fff;font-family:var(--kop);font-weight:700;font-size:.9rem;text-align:center;line-height:24px}
.matkol{border:1px solid #cfd5d8;padding:14px 16px}
.matkol h3{margin-bottom:0}
@media(max-width:700px){.dtwee{grid-template-columns:minmax(0,1fr)}}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.dgrid div{background:var(--achtergrond);padding:10px 12px;font-size:.88rem}
.dgrid b{display:block;font-family:var(--kop);font-weight:700;text-transform:uppercase;font-size:.85rem;color:var(--teal);letter-spacing:.3px}
.mg{font-family:var(--kop);font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:12px 0 2px}
.mg-ja{color:var(--groen-donker)}.mg-nee{color:var(--koraal)}.mg-onb{color:#888}
.hn{display:inline-block;font-family:var(--kop);font-size:.78rem;font-weight:700;text-transform:uppercase;padding:1px 8px;margin-left:6px;letter-spacing:.3px}
.hn.ja{background:var(--groen);color:#fff}
.hn.nee{background:var(--koraal);color:#fff}
.hn.onb{background:#ddd;color:#555}
.tip{background:var(--achtergrond);border-left:6px solid var(--teal);padding:11px 16px;font-size:.9rem}
.kijkertip{background:rgba(230,183,3,.14);border-left:6px solid var(--geel);padding:11px 16px;font-size:.9rem}
footer{background:var(--donker);color:#ccc;text-align:center;font-size:.8rem;padding:24px}
@media(max-width:560px){.tegels{grid-template-columns:repeat(3,minmax(0,1fr))}}

.fextra{display:none;gap:14px}
.fextra.open{display:grid}
.ftoggle{display:flex;align-self:flex-start;font-family:var(--kop);font-size:1.05rem;font-weight:700;text-transform:uppercase;background:#fff;color:var(--teal);border:2px solid var(--teal);border-radius:0;padding:9px 14px;cursor:pointer;text-align:left;justify-content:space-between;align-items:center}
.ftoggle::after{content:"▾";margin-left:auto;padding-left:10px}
.ftoggle[aria-expanded=true]::after{content:"▴"}
.ftoggle .n{background:var(--groen);color:#fff;padding:0 8px;margin-left:8px;font-size:.9rem}
.raster,.kraster{grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr))}
.kraster{grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr))}
.tegels{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.chip.tegel{hyphens:none;overflow-wrap:normal}
dialog{max-height:calc(100vh - 24px);overflow:auto}
@media(max-width:700px){
  main{padding:14px 12px 44px}
  .hero .in{padding:20px 14px 22px}
  .hero h1{font-size:1.55rem}
  .top .in{padding:10px 14px}
  .merk{font-size:1.8rem}
  .filters{padding:14px 12px;gap:12px}
  .veld,.veld.zoek{flex:1 1 100%;width:100%}
  .veld select,.veld input{min-width:0;width:100%}
  .rij,.rij.seg-rij{gap:12px}
  .ftoggle{align-self:stretch}
  .tegels{grid-template-columns:repeat(3,minmax(0,1fr))}
  .chip.tegel{font-size:.72rem;padding:8px 2px;letter-spacing:0}
  .sg{display:flex;width:100%;flex-wrap:wrap}
  .sg .chip.seg{flex:1 1 auto;text-align:center;border-bottom:2px solid var(--lijn);margin-bottom:-2px}
  .balk h2{font-size:1.25rem}
  .kijker{padding:12px}
  .raster{gap:12px}
  .kaart h3{font-size:1.25rem}
  .dkop{padding:14px 16px}
  .dkop h2{font-size:1.5rem}
  .dbody{padding:14px 14px 18px;gap:12px}
  .dtwee{grid-template-columns:minmax(0,1fr)}
  .wat{padding:12px 14px}
  .dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  dialog{width:calc(100% - 16px)}
}
@media(max-width:380px){.tegels{grid-template-columns:repeat(2,minmax(0,1fr))}.meta{flex-direction:column}}

/* ===== opbouw met zijkolom ===== */
.kop{background:var(--teal);color:#fff}
.kop .in{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
.kop .merk{color:#fff;font-size:2.3rem}
.kop h1{color:#fff;font-size:1.3rem;line-height:1.15;border-left:2px solid rgba(255,255,255,.45);padding-left:18px}
.kop .vb{margin-left:auto;background:var(--paars);color:var(--donker);font-family:var(--kop);font-weight:700;font-size:.85rem;padding:3px 10px}
main.opbouw{max-width:1280px;padding:22px 20px 60px;display:grid;grid-template-columns:280px minmax(0,1fr);gap:26px;align-items:start}
.zij{background:var(--achtergrond);padding:12px 16px;display:grid;gap:10px;align-content:start}
.zij.plak{position:sticky;top:12px}
.zij .veld{gap:4px}
.zij .veld label,.zij .veld .lbl{font-size:.9rem}
.zij .chip{padding:4px 8px}
.zij .fextra{gap:11px}
.zij .matnota{margin-top:5px;padding:5px 10px}
.zij .veld select{min-width:0;width:100%}
.zij .tegels{grid-template-columns:minmax(0,1fr);gap:5px}
.zij .chip.tegel{flex-direction:row;justify-content:flex-start;gap:7px;padding:4px 8px;font-size:.8rem;text-align:left}
.zij .chip.tegel .ti{font-size:1.05rem}
.zij .sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;border:none;background:none}
.zij .sg[data-groep=duur]{grid-template-columns:repeat(2,minmax(0,1fr))}
.zij .sg[data-groep=fysiek]{grid-template-columns:minmax(0,1fr)}
.zij .chip.seg,.zij .sg .chip.seg:last-child{border:2px solid var(--lijn);padding:5px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin:0}
.zij .chip.seg[aria-pressed=true]{border-color:var(--groen)}
.zij .groep[data-groep=mat]{flex-direction:column}
.zij .groep[data-groep=mat] .chip{text-align:left}
.fextra{display:grid;gap:14px}
.ftoggle{display:none}
.res .zoek input{width:100%;min-width:0;padding:11px 14px;font-size:.95rem}
.res .balk{margin:16px 0 12px}
.raster{grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr))}
.kaart.tipk{background:#fffbea;box-shadow:inset 0 0 0 2px var(--geel)}
.tipb{display:inline-block;font-family:var(--kop);font-size:.82rem;font-weight:700;text-transform:uppercase;background:var(--geel);color:var(--donker);padding:1px 8px;letter-spacing:.3px}
.kaart q{font-size:.82rem;font-style:italic;color:#7a6512;quotes:"“" "”"}
@media(max-width:860px){
  main.opbouw{grid-template-columns:minmax(0,1fr);gap:14px;padding:14px 12px 44px}
  .zij,.zij.plak{position:static;padding:14px 12px;gap:12px}
  .ftoggle{display:flex;align-self:stretch}
  .fextra{display:none}
  .fextra.open{display:grid}
  .zij .tegels{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .kop .in{padding:12px 14px}
  .kop .merk{font-size:1.8rem}
  .kop h1{font-size:1.05rem;padding-left:12px}
}
@media(max-width:520px){.kop .vb{margin-left:0}.kop h1{border-left:none;padding-left:0;flex-basis:100%;font-size:.95rem}}

/* ===== kaarten: beeldvlak (A) en afwisselend (B) ===== */
.kaart{padding:0;gap:0}
.kin{padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1;min-width:0}
.beeld{position:relative;height:140px;display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden}
.beeld img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.b-knutselen{background:var(--geel)}.b-binnen{background:var(--teal)}.b-buiten{background:var(--groen)}.b-wacht{background:var(--paars)}.b-kennismaking{background:var(--koraal)}
.weergave{display:flex;align-items:center;gap:0}
.weergave .lbl{font-family:var(--kop);font-weight:700;text-transform:uppercase;font-size:.85rem;margin-right:8px}
.weergave button{font:inherit;font-size:.8rem;background:#fff;border:2px solid var(--lijn);padding:4px 10px;cursor:pointer;color:var(--tekst)}
.weergave button+button{border-left:none}
.weergave button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.raster.wb{grid-auto-flow:row}
.raster.wb .kaart:not(.metfoto):not(.breed) .beeld{display:none}
.raster.wb .kaart.breed{grid-column:span 2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.raster.wb .kaart.breed .beeld{height:auto;min-height:220px}
@media(max-width:620px){.raster.wb .kaart.breed{grid-column:auto;display:flex}.raster.wb .kaart .beeld{min-height:0;height:140px}}

/* ===== tellers, actieve filters, verras me, typekleuren ===== */
.cnt{font-size:.72rem;color:#999;margin-left:5px;font-weight:400}
.chip[aria-pressed=true] .cnt{color:inherit;opacity:.85}
.chip.tegel .cnt{margin-left:auto}
.chip.nul{opacity:.4}
.chip.tegel{min-width:0}
.chip.tegel span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.balk .rechts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.verras{font-family:var(--kop);font-weight:700;text-transform:uppercase;font-size:.9rem;background:var(--koraal);color:#fff;border:none;padding:6px 14px;cursor:pointer;letter-spacing:.3px}
.verras:hover{background:#c23a26}
.actief{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 14px}
.af{font:inherit;font-size:.8rem;background:var(--groen-licht);border:2px solid var(--groen);color:var(--donker);padding:3px 9px;cursor:pointer}
.af span{margin-left:4px;font-weight:700}
.af:hover{background:var(--groen);color:#fff}
.actief .reset{margin-left:4px}
.zij .chip.tegel{border-left-width:7px}
.chip.tegel[data-id=knutselen]{border-left-color:var(--geel)}
.chip.tegel[data-id=binnen]{border-left-color:var(--teal)}
.chip.tegel[data-id=buiten]{border-left-color:var(--groen)}
.chip.tegel[data-id=wacht]{border-left-color:var(--paars)}
.chip.tegel[data-id=kennismaking]{border-left-color:var(--koraal)}
.chip.tegel[data-id=knutselen][aria-pressed=true]{background:var(--geel);border-color:var(--geel);color:var(--donker)}
.chip.tegel[data-id=binnen][aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.tegel[data-id=buiten][aria-pressed=true]{background:var(--groen);border-color:var(--groen);color:#fff}
.chip.tegel[data-id=wacht][aria-pressed=true]{background:var(--paars);border-color:var(--paars);color:var(--donker)}
.chip.tegel[data-id=kennismaking][aria-pressed=true]{background:var(--koraal);border-color:var(--koraal);color:#fff}

/* ===== kaartonderkant ===== */
.meta2{margin-top:auto;padding-top:9px;border-top:1px solid #eee;display:grid;gap:4px;font-size:.78rem;color:#666}
.meta2 .r2{display:flex;flex-wrap:wrap;gap:3px 12px}
.ond{display:flex;align-items:center;gap:3px}
.ond .d{display:inline-block;width:9px;height:9px;border-radius:50%;background:#dcdfe1}
.ond .d.on{background:var(--teal)}
.ond .d:last-of-type{margin-right:4px}
.m-ok{color:var(--groen-donker);font-weight:700}
.m-zelf{color:#666}
.m-onb{color:#999}

/* ===== Ollie de olifant ===== */
.kaart{position:relative;overflow:hidden}
.kin{position:relative;z-index:1}

<body>

<header class="kop"><div class="in">
  <div class="merk"><span class="olie olie-w" aria-hidden="true"></span>Hannibal</div>
  <h1>De activiteitendatabank van Hannibal,<br>door Hannibalvrijwilligers</h1>
  <span class="vb">Voorbeeldversie</span>
</div></header>

<main class="opbouw">
  <aside class="zij" aria-label="Filters">
    <div class="veld">
      <label for="kamp">Vakantie</label>
      <select id="kamp"><option value="">Alle vakanties</option></select>
    </div>
    <p class="nota" id="kampnota" hidden></p>
    <div class="veld"><span class="lbl">Soort activiteit</span><div class="groep tegels" data-groep="type"></div></div>
    <button type="button" class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="fextra"></button>
    <div class="fextra" id="fextra">
      <div class="veld"><span class="lbl">Ondersteuningsnood</span><div class="sg" data-groep="mentaal"></div></div>
      <div class="veld"><span class="lbl">Fysieke beperking</span><div class="sg" data-groep="fysiek"></div></div>
      <div class="veld"><span class="lbl">Begeleiding</span><div class="sg" data-groep="vorm"></div></div>
      <div class="veld"><span class="lbl">Duur</span><div class="sg" data-groep="duur"></div></div>
      <div class="veld"><span class="lbl">Materiaal</span><div class="groep" data-groep="mat"></div></div>
      <button class="reset" id="reset" type="button">Alles wissen</button>
    </div>
  </aside>

  <section class="res" aria-label="Activiteiten">
    <div class="veld zoek"><label for="zoek" class="sr">Zoeken</label>
      <input id="zoek" type="search" placeholder="Zoek op naam, materiaal of thema…"></div>
    <div class="balk"><h2 id="aantal" aria-live="polite"></h2><div class="rechts"><button type="button" class="verras" id="verras">🎲 Verras me</button><div class="weergave" role="group" aria-label="Weergave"><span class="lbl">Weergave</span><button type="button" data-w="a">▦ Gelijk</button><button type="button" data-w="b">▤ Afwisselend</button></div></div></div>
    <div class="actief" id="actief" hidden></div>
    <div class="raster" id="raster"></div>
    <div class="meerw" id="meerw" hidden><button type="button" class="meer" id="meer"></button><small id="meertel"></small></div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dtitel"></dialog>

<script>
/* ============ INSTELLINGEN – hier pas je de inhoud aan ============ */
// Basistekst (inhoud) maximum 160 tekens, zodat hij volledig op de kaart past. Langere info hoort in "Zo pak je het aan".
const MAX_INHOUD=160;

 "Vlaggetjes knutselen":["Knip vooraf vlaggetjes uit gekleurd papier.", "Vraag wat de deelnemer graag heeft: kleur, eten of programma.", "Maak vlaggetjes: jij tekent, de deelnemer kleurt in.", "Hang de vlaggetjes op een mooie plek."],
 "Zoektocht in het gebouw":["Verstop vooraf enveloppen of kleurplaten in het gebouw, bv. steeds in dezelfde kleur.", "Stop in elke envelop een vraag over de deelnemer en over jezelf.", "Geef elke vraag een tip naar de volgende locatie.", "Zoek samen alle enveloppen en beantwoord de vragen."]
};
ACT.forEach(a=>{if(a.inhoud.length>MAX_INHOUD)console.warn("Te lang ("+a.inhoud.length+"/"+MAX_INHOUD+"): "+a.t)});
const kijkerVan = a => KIJKER.find(k=>k.act===a.t);
// Iconen (emoji): pas ze hier aan
const ICO_TYPE = {knutselen:"🎨", binnen:"🏠", buiten:"🌳", wacht:"⏳", kennismaking:"👋"};
const ICO_VORM = {"1op1":"🧍", "2op1":"👫", groep:"👥"};
const ICO_NIV  = {licht:"🌱", matig:"🌿", zwaar:"🌳"};
const ICO_THEMA = {Creatief:"🎨", Zomer:"☀️", Zintuigen:"🖐️", Water:"💦", Natuur:"🍃", Eten:"🍎", Spel:"🎲", Muziek:"🎵", Rust:"🌙", Foto:"📷", Wind:"💨", Beweging:"🏃", Terugblik:"📰", Avond:"🕯️", Bouwen:"🧱", Mikspel:"🎯", Zoektocht:"🔍", "Eerste dag":"👋"};
const icoThema = t => ICO_THEMA[t]||"✨";


/* ============ Programma ============ */
const $=(s,r=document)=>r.querySelector(s);
const thema = [...new Set(ACT.map(a=>a.thema))].sort();
const PAGE=12;let lastKey="";
const state = {n:PAGE, kamp:"", fysiek:false, mentaal:new Set(), type:new Set(), vorm:new Set(), duur:new Set(), thema:new Set(), mat:new Set(), q:""};

function matStatus(a){
  if(!a.mat.length) return {k:"ok",t:"Geen materiaal nodig"};
  const zelf=a.mat.filter(m=>m.h===false);
  if(zelf.length) return {k:"koop",t:"Zelf voorzien: "+zelf.length+" item"+(zelf.length>1?"s":"")};
  if(a.mat.some(m=>m.h===null)) return {k:"onb",t:"Herkomst materiaal nog invullen"};
  return {k:"ok",t:"Alles van Hannibal"};
}
function dur(m,t){if(t)return t;if(m==null)return "duur niet vermeld";return m>=60?(Math.floor(m/60)+" u"+(m%60?" "+m%60:"")):m+" min"}

// kampen (keuzelijst)
const ksel=$("#kamp");
KAMPEN.forEach((k,i)=>{const o=document.createElement("option");o.value=i;o.textContent=k.naam+" ("+k.leeftijd+")"+(k.profiel?"":" *");ksel.appendChild(o)});
const wisKamp=()=>{if(state.kamp===""){return}state.kamp="";ksel.value="";$("#kampnota").hidden=true};
ksel.onchange=()=>{
  state.kamp=ksel.value;
  const nota=$("#kampnota");
  if(state.kamp===""){nota.hidden=true;render();return}
  const k=KAMPEN[state.kamp];
  if(k.profiel){
    state.mentaal=new Set(k.profiel.mentaal);state.fysiek=k.profiel.fysiek;state.vorm=new Set(k.profiel.vorm);
    nota.textContent="De filters zijn aangepast aan jouw vakantie. :-)";
  }else{
    nota.textContent=k.naam+": het profiel van deze vakantie is nog niet ingevuld, kies zelf de filters.";
  }
  nota.hidden=false;render();
};

// chips
const ICO_CHIP=(g,id)=>g==="type"?ICO_TYPE[id]:g==="vorm"?"":g==="mentaal"?"":g==="thema"?icoThema(id):g==="duur"?"":g==="mat"?({geenaankoop:"🛒",hannibal:"🎒",geen:"🙌"})[id]:"";
function maakChips(groep,opts){
  const w=$(`[data-groep="${groep}"]`);
  opts.forEach(([id,label,hulp])=>{
    const c=document.createElement("button");c.type="button";c.className="chip"+(groep==="type"?" tegel":["mentaal","vorm","duur"].includes(groep)?" seg":"");
    c.dataset.label=label;if(groep==="type"){c.innerHTML='<span class="ti" aria-hidden="true">'+ICO_CHIP(groep,id)+'</span><span>'+label+'</span><span class="cnt"></span>'}else{c.innerHTML=(ICO_CHIP(groep,id)?ICO_CHIP(groep,id)+" ":"")+label+'<span class="cnt"></span>'}c.setAttribute("aria-pressed","false");c.dataset.id=id;
    if(hulp)c.title=hulp;
    c.onclick=()=>{if(["mentaal","vorm"].includes(groep))wisKamp();const s=state[groep];s.has(id)?s.delete(id):s.add(id);render()};
    w.appendChild(c);
  });
}
maakChips("mentaal",Object.entries(NIVEAUS).map(([id,l])=>[id,l,NIVEAU_HULP[id]]));
{const c=document.createElement("button");c.type="button";c.className="chip seg";c.id="fysiekchip";c.innerHTML='Aangepast<span class="cnt"></span>';c.setAttribute("aria-pressed","false");c.title=FYSIEK.ja;
 c.onclick=()=>{wisKamp();state.fysiek=!state.fysiek;render()};$('[data-groep="fysiek"]').appendChild(c)}
maakChips("type",Object.entries(TYPES));
maakChips("vorm",Object.entries(VORMEN).map(([i,l])=>[i,i==="groep"?"Groep":l]));
maakChips("duur",DUREN.map(d=>[d.id,d.label]));
maakChips("mat",[["geenaankoop","Niets zelf voorzien"],["hannibal","Enkel Hannibal-materiaal"],["geen","Geen materiaal nodig"]]);

$("#zoek").oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};
$("#ftoggle").onclick=()=>{const o=$("#fextra").classList.toggle("open");$("#ftoggle").setAttribute("aria-expanded",String(o))};
$("#reset").onclick=()=>{state.kamp="";state.fysiek=false;ksel.value="";$("#kampnota").hidden=true;["mentaal","type","vorm","duur","thema","mat"].forEach(g=>state[g].clear());state.q="";$("#zoek").value="";render()};

const TEST={
  mentaal:(a,id)=>niv(a).includes(id),
  type:(a,id)=>a.type.includes(id),
  vorm:(a,id)=>a.vorm.includes(id),
  duur:(a,id)=>a.min!=null&&DUREN.find(d=>d.id===id).test(a.min),
  thema:(a,id)=>a.thema===id,
  mat:(a,id)=>{const zelf=a.mat.some(m=>!m.h);return id==="geenaankoop"?!zelf:id==="hannibal"?(a.mat.length>0&&!zelf):a.mat.length===0}
};
// skip = groep die je negeert (om te tellen hoeveel resultaten een optie zou geven)
function past(a,skip){
  for(const g in TEST){if(g===skip)continue;const st=state[g];if(st.size&&![...st].some(id=>TEST[g](a,id)))return false}
  if(skip!=="fysiek"&&state.fysiek&&!fys(a)) return false;
  if(state.q){
    const hay=[a.t,a.inhoud,a.thema,...a.mat.map(m=>m.n)].join(" ").toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}
function tellers(){
  ["mentaal","type","vorm","duur","mat"].forEach(g=>{
    const basis=ACT.filter(a=>past(a,g));
    document.querySelectorAll(`[data-groep="${g}"] .chip`).forEach(c=>{
      const n=basis.filter(a=>TEST[g](a,c.dataset.id)).length;
      c.querySelector(".cnt").textContent=n;c.classList.toggle("nul",n===0&&c.getAttribute("aria-pressed")!=="true");
    });
  });
  const fc=$("#fysiekchip"),n=ACT.filter(a=>past(a,"fysiek")&&fys(a)).length;
  fc.querySelector(".cnt").textContent=n;fc.classList.toggle("nul",n===0&&!state.fysiek);
}
const GROEPNAAM={mentaal:"Ondersteuning",vorm:"Begeleiding",duur:"Duur",mat:"Materiaal",type:""};
function actieveFilters(){
  const w=$("#actief"),items=[];
  if(state.kamp!=="")items.push([KAMPEN[state.kamp].naam,()=>{wisKamp()}]);
  if(state.q)items.push(["“"+state.q+"”",()=>{state.q="";$("#zoek").value=""}]);
  ["type","mentaal","fysiek","vorm","duur","mat"].forEach(g=>{
    if(g==="fysiek"){if(state.fysiek)items.push(["Fysiek aangepast",()=>{wisKamp();state.fysiek=false}]);return}
    state[g].forEach(id=>{const c=$(`[data-groep="${g}"] .chip[data-id="${id}"]`);const l=(GROEPNAAM[g]?GROEPNAAM[g]+": ":"")+(c?c.dataset.label:id);
      items.push([l,()=>{if(g==="mentaal"||g==="vorm")wisKamp();state[g].delete(id)}])});
  });
  w.innerHTML="";w.hidden=!items.length;
  items.forEach(([l,f])=>{const b=document.createElement("button");b.type="button";b.className="af";b.innerHTML=l+' <span aria-hidden="true">✕</span>';b.setAttribute("aria-label",l+" wissen");b.onclick=()=>{f();render()};w.appendChild(b)});
  if(items.length>1){const r=document.createElement("button");r.type="button";r.className="reset";r.textContent="Alles wissen";r.onclick=()=>$("#reset").click();w.appendChild(r)}
}

let huidige=[],weergave="a";
// Onderkant van een kaart: lijn 1 = ondersteuningsnood (bolletjes), lijn 2 = duur · begeleiding · materiaal
const KORT={"1op1":"1:1","2op1":"2:1",groep:"groep"},NV=["licht","matig","zwaar"];
function metaKaart(a){
  const n=new Set(niv(a)),aan=NV.map(x=>n.has(x));
  let woord="";
  if(n.size===3)woord="voor iedereen";
  else if(n.size===2)woord=(aan[1]?NV.filter(x=>n.has(x)).join(" – "):"licht, zwaar");
  else if(n.size===1)woord=[...n][0];
  const bol=n.size?`<span class="ond" title="Ondersteuningsnood">${aan.map(x=>`<i class="d${x?" on":""}"></i>`).join("")} ${woord}</span>`:"";
  const tijd=a.dt?a.dt:(a.min==null?"flexibel":dur(a.min));
  const vorm=a.vorm.length===3?"alle vormen":["1op1","2op1","groep"].filter(v=>a.vorm.includes(v)).map(v=>KORT[v]).join(" · ");
  const zelf=a.mat.filter(m=>m.h===false).length,onb=a.mat.some(m=>m.h===null);
  const mat=!a.mat.length?'<span class="m-ok">✓ niets nodig</span>':zelf?`<span class="m-zelf">🛒 ${zelf} zelf</span>`:onb?'<span class="m-onb">? materiaal</span>':'<span class="m-ok">✓ Hannibal</span>';
  return `<div class="meta2">${bol}<div class="r2"><span>⏱ ${tijd}</span><span>${a.vorm.length>1?"👥":"👤"} ${vorm}</span>${mat}</div></div>`;
}
const hasj=t=>[...t].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
// Afwisselend: om de andere rij krijgt één activiteit met foto (of een tip) een breed vak,
// afwisselend links en rechts. De rest vult de rij op, zodat er geen gaten ontstaan.
function schik(items){
  const r=$("#raster"),C=Math.max(1,Math.floor((r.clientWidth+16)/256));
  if(weergave!=="b"||C<2||innerWidth<=620){const rijen=[];for(let k=0;k<items.length;k+=C)rijen.push(items.slice(k,k+C).map(x=>({...x,breed:false})));return rijen}
  const rest=items.slice(),uit=[];/* uit = lijst van rijen */let rij=0,breedRij=0;
  const kand=x=>!!x.a.foto||!!kijkerVan(x.a);
  while(rest.length){
    let w=null;
    if(rij%2===0){
      const venster=rest.slice(0,C*3),met=venster.filter(kand);
      const keus=met.length?met:venster;
      w=keus.find(x=>kijkerVan(x.a))||keus[hasj(keus[0].a.t+rij)%keus.length];rest.splice(rest.indexOf(w),1);
    }
    if(w){
      const klein=rest.splice(0,C-2).map(x=>({...x,breed:false})),b={...w,breed:true};
      uit.push(breedRij%2===0?[b,...klein]:[...klein,b]);breedRij++;
    }else uit.push(rest.splice(0,C).map(x=>({...x,breed:false})));
    rij++;
  }
  return uit;
}
function render(){
  {const n=["mentaal","type","vorm","duur","mat"].reduce((t,g)=>t+state[g].size,0)+(state.fysiek?1:0);
   $("#ftoggle").innerHTML="Filters"+(n?'<span class="n">'+n+'</span>':"");}
  $("#fysiekchip").setAttribute("aria-pressed",String(state.fysiek));
  ["mentaal","type","vorm","duur","thema","mat"].forEach(g=>document.querySelectorAll(`[data-groep="${g}"] .chip`).forEach(c=>c.setAttribute("aria-pressed",String(state[g].has(c.dataset.id)))));
  const key=JSON.stringify([state.kamp,state.fysiek,[...state.mentaal],[...state.type],[...state.vorm],[...state.duur],[...state.thema],[...state.mat],state.q]);
  if(key!==lastKey){state.n=PAGE;lastKey=key}
  const lijst=ACT.map((a,i)=>({a,i})).filter(x=>past(x.a));
  huidige=lijst;tellers();actieveFilters();
  const standaard=state.kamp===""&&!state.fysiek&&!state.q&&["mentaal","type","vorm","duur","thema","mat"].every(g=>state[g].size===0);
  lijst.sort((x,y)=>(kijkerVan(y.a)?1:0)-(kijkerVan(x.a)?1:0));
  $("#aantal").textContent = lijst.length+(lijst.length===1?" activiteit gevonden":" activiteiten gevonden")+(state.kamp!==""?" voor "+KAMPEN[state.kamp].naam:"");
  const mw=$("#meerw");mw.hidden=true;
  const r=$("#raster");r.innerHTML="";
  if(!lijst.length){r.innerHTML='<div class="leeg"><span class="olie olie-g" aria-hidden="true"></span><div class="ballon"><b>Ollie heeft niks gevonden…</b>Probeer een filter minder, of klik op “Alles wissen”.</div></div>';return}
  const toon=[];for(const rij of schik(lijst)){if(toon.length>=state.n)break;toon.push(...rij)}
  const getoond=toon.length;
  toon.forEach(({a,i,breed})=>{
    const s=matStatus(a);
    const k=document.createElement("button");k.type="button";k.className="kaart t-"+a.type[0]+(kijkerVan(a)?" tipk":"");const kv=kijkerVan(a);
    const t0=a.type[0];if(a.foto)k.classList.add("metfoto");if(breed)k.classList.add("breed");
    k.innerHTML=`<div class="beeld b-${t0}"><span aria-hidden="true">${ICO_TYPE[t0]||""}</span>${a.foto?`<img src="${a.foto}" alt="" loading="lazy" onerror="this.remove()">`:""}</div><div class="kin">${kv?`<span><span class="tipb"><i class="olie olie-d" aria-hidden="true"></i>Tip van ${kv.naam}</span></span>`:""}<div class="tags">${a.type.map(t=>`<span class="tag">${TYPES[t]}</span>`).join("")}</div>
      <h3>${a.t}</h3><p>${a.inhoud}</p>${kv&&kv.quote?`<q>${kv.quote}</q>`:""}
      ${metaKaart(a)}</div>${kv?"":'<span class="olie olie-g wm" aria-hidden="true"></span>'}`;
    k.onclick=()=>open(i);r.appendChild(k);
  });
  const rest=lijst.length-getoond;
  if(rest>0){mw.hidden=false;$("#meer").innerHTML="<span>Toon "+Math.min(PAGE,rest)+" meer</span>";$("#meertel").textContent=getoond+" van "+lijst.length+" getoond";}
  else if(lijst.length>PAGE){mw.hidden=false;$("#meer").hidden=true;$("#meertel").textContent="Alle "+lijst.length+" getoond"}
  if(rest>0)$("#meer").hidden=false;
}
function plak(){const z=$(".zij");z.classList.remove("plak");if(z.offsetHeight+24<=innerHeight)z.classList.add("plak")}
let rt;addEventListener("resize",()=>{plak();clearTimeout(rt);rt=setTimeout(()=>{if(weergave==="b")render()},150)});$("#ftoggle").addEventListener("click",plak);setTimeout(plak,50);
try{weergave=localStorage.getItem("hb-weergave")||"a"}catch(e){}
function zetWeergave(w){const oud=weergave;weergave=w;$("#raster").classList.toggle("wb",w==="b");document.querySelectorAll(".weergave button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.w===w)));try{localStorage.setItem("hb-weergave",w)}catch(e){}if(oud!==w||w==="b")render()}
document.querySelectorAll(".weergave button").forEach(b=>b.onclick=()=>zetWeergave(b.dataset.w));zetWeergave(weergave);
$("#verras").onclick=()=>{if(!huidige.length)return;open(huidige[Math.floor(Math.random()*huidige.length)].i)};
$("#meer").onclick=()=>{state.n+=PAGE;render()};

function open(i){
  const a=ACT[i],d=$("#dlg"),s=matStatus(a);
  d.innerHTML=`<div class="dkop"><div><div class="tags">${a.type.map(t=>`<span class="tag type">${TYPES[t]}</span>`).join("")}</div><h2 id="dtitel">${a.t}</h2></div><button type="button" aria-label="Sluiten" id="x">✕</button></div>
  ${a.foto?`<img class="dfoto" src="${a.foto}" alt="${a.t}" onerror="this.remove()">`:""}
  <div class="dbody">
    <div class="dgrid">
      <div><b>Duur</b>${dur(a.min,a.dt)}</div>
      <div><b>Begeleiding</b>${a.vorm.map(v=>VORMEN[v]).join(", ")}</div>
            <div><b>Ondersteuningsnood</b>${niv(a).map(n=>NIVEAUS[n]).join(", ")}</div>
      <div><b>Fysieke beperking</b>${fys(a)?"Aangepast mogelijk":"Niet aangepast"}</div>
    </div>
    <div class="dtwee">
      <div class="links">
        <div class="wat"><h3>Wat doen we?</h3><p>${a.inhoud}</p></div>
        ${(STAPPEN[a.t]||[]).length?`<div class="stap"><h3>Zo pak je het aan</h3><ol>${STAPPEN[a.t].map(x=>`<li>${x}</li>`).join("")}</ol></div>`:""}
      </div>
    <aside class="matkol"><h3>Materiaal</h3>
        ${a.mat.length?[[true,"Hannibalmateriaal","mg-ja"],[false,"Zelf voorzien","mg-nee"],[null,"Herkomst nog invullen","mg-onb"]].map(([v,t,c])=>{const l=a.mat.filter(m=>m.h===v);return l.length?`<div class="mg ${c}">${t}</div><ul>${l.map(m=>`<li>${m.n}</li>`).join("")}</ul>`:""}).join(""):"<p style='margin:0'>Je hebt niets nodig.</p>"}
        ${a.mat.some(m=>m.h!==false)?`<p class="matnota">Check bij je VV of dit Hannibalmateriaal meegaat op jouw vakantie.</p>`:""}
      </aside>
    </div>
    ${kijkerVan(a)&&(kijkerVan(a).quote||kijkerVan(a).naam)?`<div class="kijkertip"><b>In de kijker${kijkerVan(a).naam?" – gekozen door "+kijkerVan(a).naam:""}</b>${kijkerVan(a).quote?"<br>“"+kijkerVan(a).quote+"”":""}</div>`:""}
    ${a.tip?`<div class="tip"><b>Tip:</b> ${a.tip}</div>`:""}
    ${a.bron?`<p style="margin:0;font-size:.78rem;color:#888">Bron: ${a.bron}</p>`:""}
  </div>`;
  d.showModal();$("#x",d).onclick=()=>d.close();
  const f=$(".dfoto",d);if(f)f.onclick=()=>{const z=$("#zoom");$("img",z).src=f.src;$("img",z).alt=f.alt;z.showModal()};
}
$("#zoom").addEventListener("click",e=>e.currentTarget.close());
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});
render();
</script>
